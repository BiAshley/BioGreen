<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VeriGlicerina - Detector Global en Tiempo Real (E422)</title>
  
  <!-- Estilos Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Librería de Escáner de Barras -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <!-- Librería OCR Tesseract.js -->
  <script src="https://unpkg.com/tesseract.js@v4.0.2/dist/tesseract.min.js"></script>
  
  <style>
    #reader video, #ocr-video {
      object-fit: cover !important;
      border-radius: 0.75rem;
      width: 100% !important;
      min-height: 220px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen pb-12">

  <header class="bg-slate-900 border-b border-rose-600/30 py-4 px-4 shadow-lg sticky top-0 z-50">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="bg-rose-600/20 p-2 rounded-lg border border-rose-500/30">
          <svg class="w-6 h-6 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
        </div>
        <div>
          <h1 class="text-base font-extrabold tracking-tight">VeriGlicerina <span class="text-rose-500 text-xs px-1.5 py-0.5 rounded bg-rose-500/10 border border-rose-500/20">LIVE</span></h1>
          <p class="text-[10px] text-slate-400">Detector Global de Glicerina (E422)</p>
        </div>
      </div>
      <!-- Selector de Modo -->
      <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800">
        <button onclick="cambiarModo('barcode')" id="btn-mode-bc" class="text-xs px-3 py-1.5 rounded-lg font-bold bg-rose-600 text-white transition">Barras</button>
        <button onclick="cambiarModo('ocr')" id="btn-mode-ocr" class="text-xs px-3 py-1.5 rounded-lg font-bold text-slate-400 hover:text-white transition">OCR Cámara</button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-5">

    <!-- Tarjeta del Escáner de Código de Barras -->
    <div id="scanner-card" class="bg-slate-900 p-4 rounded-2xl shadow-xl border border-slate-800">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Escáner de Código de Barras</h2>
        <span class="text-[10px] text-slate-500">Universal</span>
      </div>
      
      <div id="reader" class="w-full bg-black rounded-xl overflow-hidden min-h-[220px] border border-slate-800"></div>

      <div class="mt-3 flex gap-2">
        <input type="text" id="manual-ean" placeholder="Ej. 8682241215607" class="flex-1 text-xs px-3 py-2 bg-slate-950 border border-slate-800 text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-500">
        <button onclick="buscarPorManual()" class="bg-rose-600 text-white text-xs px-4 py-2 rounded-xl font-bold hover:bg-rose-500 transition">Buscar</button>
      </div>
    </div>

    <!-- Tarjeta del Escáner OCR en Vivo por Cámara -->
    <div id="ocr-card" class="hidden bg-slate-900 p-4 rounded-2xl shadow-xl border border-slate-800">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-xs font-bold text-rose-400 uppercase tracking-wider">Cámara OCR - Ingredientes en Vivo</h2>
        <span class="text-[10px] text-slate-500">Multi-Idioma</span>
      </div>

      <div class="relative w-full bg-black rounded-xl overflow-hidden min-h-[220px] border border-slate-800">
        <video id="ocr-video" autoplay playsinline muted class="w-full h-full object-cover min-h-[220px]"></video>
        <canvas id="ocr-canvas" class="hidden"></canvas>
        <div class="absolute inset-0 border-2 border-rose-500/40 rounded-xl pointer-events-none flex items-center justify-center">
          <div class="bg-slate-950/70 px-3 py-1 rounded-lg border border-rose-500/30 text-[10px] text-rose-300 font-bold uppercase tracking-wider">Apunta los ingredientes aquí</div>
        </div>
      </div>

      <button onclick="capturarYEvaluarOCR()" class="mt-3 w-full bg-rose-600 hover:bg-rose-500 text-white text-xs py-3 rounded-xl font-bold shadow-lg transition flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        <span>Escanear Texto de la Etiqueta Ahora</span>
      </button>
    </div>

    <!-- Resultados -->
    <div id="result-card" class="hidden bg-slate-900 p-5 rounded-2xl shadow-xl border border-slate-800">
      <div id="badge-container" class="mb-3"></div>
      <h3 id="res-product-name" class="text-base font-extrabold text-white leading-snug">--</h3>
      <p class="text-[11px] text-slate-400 mt-1"><strong>Fuente:</strong> <span id="res-brand" class="text-slate-200">--</span> | <span id="res-code" class="text-slate-200">--</span></p>

      <div class="my-4 border-t border-slate-800"></div>

      <div class="mb-4">
        <h4 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Análisis de Componentes:</h4>
        <p id="res-analysis" class="text-xs text-slate-300 leading-relaxed bg-slate-950 p-3 rounded-xl border border-slate-800/80">--</p>
      </div>

      <div id="terms-box" class="hidden mb-4 p-3 bg-rose-950/30 rounded-xl border border-rose-900/40">
        <h4 class="text-[10px] font-bold text-rose-400 uppercase tracking-wider mb-1">Término detectado:</h4>
        <p id="res-terms-found" class="text-xs font-mono text-rose-200 font-bold">--</p>
      </div>

      <button onclick="reiniciarApp()" class="w-full bg-slate-800 hover:bg-slate-700 text-white text-xs py-3 rounded-xl font-bold transition">Nuevo Escaneo</button>
    </div>

  </main>

  <script>
    let html5QrCode;
    let ocrStream = null;

    const terminosGlicerina = [
      "glicerina", "glicerol", "e-422", "e422",
      "glycerin", "glycerine", "glycerol",
      "glycérine", "glycérol",
      "glyzerin",
      "gliceryna", "глицерин",
      "glicerina", "glicerolo",
      "1,2,3-propanetriol", "propan-1,2,3-triol", "trihydroxypropane"
    ];

    function cambiarModo(modo) {
      const bcCard = document.getElementById('scanner-card');
      const ocrCard = document.getElementById('ocr-card');
      const btnBc = document.getElementById('btn-mode-bc');
      const btnOcr = document.getElementById('btn-mode-ocr');

      if (modo === 'barcode') {
        bcCard.classList.remove('hidden');
        ocrCard.classList.add('hidden');
        btnBc.className = "text-xs px-3 py-1.5 rounded-lg font-bold bg-rose-600 text-white transition";
        btnOcr.className = "text-xs px-3 py-1.5 rounded-lg font-bold text-slate-400 hover:text-white transition";
        detenerCamaraOCR();
        inicializarEscaner();
      } else {
        bcCard.classList.add('hidden');
        ocrCard.classList.remove('hidden');
        btnOcr.className = "text-xs px-3 py-1.5 rounded-lg font-bold bg-rose-600 text-white transition";
        btnBc.className = "text-xs px-3 py-1.5 rounded-lg font-bold text-slate-400 hover:text-white transition";
        if (html5QrCode && html5QrCode.isScanning) {
          html5QrCode.stop().catch(() => {});
        }
        iniciarCamaraOCR();
      }
    }

    function inicializarEscaner() {
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }
      html5QrCode.start(
        { facingMode: "environment" }, 
        { fps: 10, qrbox: { width: 220, height: 140 } }, 
        onScanSuccess
      ).catch(err => console.warn("Cámara de barras ocupada:", err));
    }

    function onScanSuccess(decodedText) {
      if(html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => consultarAPIGlobal(decodedText));
      } else {
        consultarAPIGlobal(decodedText);
      }
    }

    function buscarPorManual() {
      const ean = document.getElementById('manual-ean').value.trim();
      if(ean) {
        if(html5QrCode && html5QrCode.isScanning) {
          html5QrCode.stop().then(() => consultarAPIGlobal(ean));
        } else {
          consultarAPIGlobal(ean);
        }
      }
    }

    // Iniciar el stream de video en vivo para OCR
    async function iniciarCamaraOCR() {
      try {
        const video = document.getElementById('ocr-video');
        ocrStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }
        });
        video.srcObject = ocrStream;
      } catch (err) {
        alert("No se pudo acceder a la cámara para OCR: " + err);
      }
    }

    function detenerCamaraOCR() {
      if (ocrStream) {
        ocrStream.getTracks().forEach(track => track.stop());
        ocrStream = null;
      }
    }

    // Capturar fotograma de la cámara en vivo y pasarlo a Tesseract
    function capturarYEvaluarOCR() {
      const video = document.getElementById('ocr-video');
      const canvas = document.getElementById('ocr-canvas');
      
      if (!video.srcObject) {
        alert("La cámara OCR no está activa.");
        return;
      }

      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      detenerCamaraOCR();
      mostrarCargando("Leyendo ingredientes en tiempo real...");

      canvas.toBlob(blob => {
        Tesseract.recognize(
          blob,
          'eng+spa+fra+deu+por+rus',
          { 
            logger: m => {
              if(m.status === 'recognizing text') {
                let porc = Math.round(m.progress * 100);
                document.getElementById('res-product-name').innerText = `Procesando OCR... (${porc}%)`;
              }
            } 
          }
        ).then(({ data: { text } }) => {
          document.getElementById('ocr-card').classList.add('hidden');
          document.getElementById('result-card').classList.remove('hidden');

          document.getElementById('res-product-name').innerText = "Análisis por Cámara en Vivo (OCR)";
          document.getElementById('res-brand').innerText = "Captura Directa de Etiqueta";
          document.getElementById('res-code').innerText = "N/A";

          const textoLimpio = text.toLowerCase();
          let encontrado = false;
          let coincidencia = "";

          for (let termino of terminosGlicerina) {
            if (textoLimpio.includes(termino)) {
              encontrado = true;
              coincidencia = termino;
              break;
            }
          }

          if (encontrado) {
            document.getElementById('badge-container').innerHTML = `
              <div class="bg-rose-500/10 border border-rose-500/30 p-3 rounded-xl text-center animate-pulse">
                <span class="text-rose-500 font-extrabold text-sm block">🚨 ¡ALERTA ROJA: GLICERINA DETECTADA!</span>
              </div>`;
            document.getElementById('res-analysis').innerText = `El texto capturado contiene componentes de glicerina. Texto leído: "${text.substring(0, 100)}..."`;
            document.getElementById('terms-box').classList.remove('hidden');
            document.getElementById('res-terms-found').innerText = `Término hallado: "${coincidencia}"`;
          } else {
            document.getElementById('badge-container').innerHTML = `
              <div class="bg-emerald-500/10 border border-emerald-500/30 p-3 rounded-xl text-center">
                <span class="text-emerald-400 font-bold text-sm block">✅ 100% LIBRE DE GLICERINA</span>
              </div>`;
            document.getElementById('res-analysis').innerText = `No se detectaron términos asociados a glicerina en el texto capturado.`;
            document.getElementById('terms-box').classList.add('hidden');
          }
        }).catch(err => {
          alert("Error en el motor OCR: " + err);
          reiniciarApp();
        });
      }, 'image/jpeg', 0.9);
    }

    async function consultarAPIGlobal(codigo) {
      mostrarCargando("Consultando bases de datos mundiales...");
      try {
        let res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${codigo}.json`);
        let data = await res.json();

        if (data.status === 1 && data.product) {
          procesarDatosProducto(
            data.product.product_name || "Producto Internacional",
            data.product.brands || "Marca Global",
            codigo,
            [
              data.product.ingredients_text || '',
              data.product.ingredients_text_es || '',
              data.product.ingredients_text_en || ''
            ].join(" ")
          );
          return;
        }

        let resUpc = await fetch(`https://api.upcitemdb.com/prod/trial/lookup?upc=${codigo}`);
        let dataUpc = await resUpc.json();

        if (dataUpc && dataUpc.items && dataUpc.items.length > 0) {
          const item = dataUpc.items[0];
          procesarDatosProducto(
            item.title || "Producto Comercial",
            item.brand || "Importado",
            codigo,
            (item.description || "") + " " + (item.title || "")
          );
          return;
        }

        mostrarNoRegistrado(codigo);
      } catch (err) {
        mostrarNoRegistrado(codigo);
      }
    }

    function procesarDatosProducto(nombre, marca, codigo, textoIngredientes) {
      document.getElementById('scanner-card').classList.add('hidden');
      document.getElementById('result-card').classList.remove('hidden');

      document.getElementById('res-product-name').innerText = nombre;
      document.getElementById('res-brand').innerText = marca;
      document.getElementById('res-code').innerText = `Código: ${codigo}`;

      let encontrado = false;
      let coincidencia = "";
      const textoLimpio = textoIngredientes.toLowerCase();

      for (let termino of terminosGlicerina) {
        if (textoLimpio.includes(termino)) {
          encontrado = true;
          coincidencia = termino;
          break;
        }
      }

      if (encontrado) {
        document.getElementById('badge-container').innerHTML = `
          <div class="bg-rose-500/10 border border-rose-500/30 p-3 rounded-xl text-center animate-pulse">
            <span class="text-rose-500 font-extrabold text-sm block">🚨 ¡ALERTA ROJA: CONTIENE GLICERINA!</span>
          </div>`;
        document.getElementById('res-analysis').innerText = "Se detectó presencia de glicerina en la formulación de este producto.";
        document.getElementById('terms-box').classList.remove('hidden');
        document.getElementById('res-terms-found').innerText = `Término hallado: "${coincidencia}"`;
      } else {
        document.getElementById('badge-container').innerHTML = `
          <div class="bg-emerald-500/10 border border-emerald-500/30 p-3 rounded-xl text-center">
            <span class="text-emerald-400 font-bold text-sm block">✅ 100% LIBRE DE GLICERINA</span>
          </div>`;
        document.getElementById('res-analysis').innerText = "No se encontró ningún término asociado a glicerina o E422 en este registro.";
        document.getElementById('terms-box').classList.add('hidden');
      }
    }

    function mostrarNoRegistrado(codigo) {
      document.getElementById('scanner-card').classList.add('hidden');
      document.getElementById('result-card').classList.remove('hidden');

      document.getElementById('res-product-name').innerText = "Código No Registrado en APIs";
      document.getElementById('res-brand').innerText = "Desconocida";
      document.getElementById('res-code').innerText = `Código: ${codigo}`;

      document.getElementById('badge-container').innerHTML = `
        <div class="bg-amber-500/10 border border-amber-500/30 p-4 rounded-xl text-center">
          <span class="text-amber-400 font-bold text-sm block">⚠️ ARTÍCULO NO INDEXADO</span>
          <p class="text-xs text-slate-300 mt-2">Cambia arriba al modo <strong>"OCR Cámara"</strong> para apuntar y leer la etiqueta de ingredientes directamente con la cámara en tiempo real.</p>
        </div>`;
      document.getElementById('res-analysis').innerText = "Usa la cámara en vivo para escanear el texto de los ingredientes al instante.";
      document.getElementById('terms-box').classList.add('hidden');
    }

    function mostrarCargando(mensaje) {
      document.getElementById('scanner-card').classList.add('hidden');
      document.getElementById('ocr-card').classList.add('hidden');
      document.getElementById('result-card').classList.remove('hidden');
      document.getElementById('res-product-name').innerText = mensaje;
      document.getElementById('res-brand').innerText = "...";
      document.getElementById('res-code').innerText = "...";
      document.getElementById('badge-container').innerHTML = `<div class="bg-slate-800 text-slate-300 text-xs p-3 rounded-xl text-center font-bold animate-pulse">PROCESANDO...</div>`;
      document.getElementById('res-analysis').innerText = "Analizando texto...";
      document.getElementById('terms-box').classList.add('hidden');
    }

    function reiniciarApp() {
      document.getElementById('result-card').classList.add('hidden');
      document.getElementById('manual-ean').value = '';
      cambiarModo('barcode');
    }

    window.onload = inicializarEscaner;
  </script>
</body>
</html>
